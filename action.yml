name: "Find changes"
description: "Outputs a JSON array of changed files for downstream actions."
branding:
  icon: check-circle
  color: blue
runs:
  using: "composite"
  steps:
    - name: Prepare cache
      id: check
      shell: sh
      env:
        VERSION: "0.13.6"
      run: |
        "$GITHUB_ACTION_PATH/scripts/cache.sh"
    - name: Generate target triple
      id: target
      shell: sh
      env:
        OS: ${{ runner.os }} # Possible values are Linux, Windows, or macOS.
        ARCH: ${{ runner.arch }} # Possible values are X86, X64, ARM, or ARM64.
      run: |
        "$GITHUB_ACTION_PATH/scripts/target.sh"
    - if: steps.check.outputs.installed != 'true'
      name: Cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.check.outputs.directory }}/compare-changes
        key: compare-changes_0.13.6_${{ steps.target.outputs.triple }}
    - if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: Download executable
      working-directory: ${{ steps.check.outputs.directory }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "0.13.6"
        TARGET: ${{ steps.target.outputs.triple }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install.sh"
    - name: Verify checksum
      shell: sh
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        TARGET: ${{ steps.target.outputs.triple }}
        MACOS_ARM_SHA: "c6fc71a9268fee7009f68417bb4dc7e6f5b0b1cb26b558113f0a9f4b9b9bef4d"
        LINUX_ARM_SHA: "e6d82a9a1209e78a3a558f3f6aeb777ba1ac69c8d664fc5e864c989d6ff5da13"
        LINUX_X64_SHA: "1638f50f7997531e58611b55c47c6ee414cc01ab52d137da787833f6834f8c2e"
      run: |
        "$GITHUB_ACTION_PATH/scripts/verify.sh"
    - name: Prepare checkout
      shell: sh
      run: |
        mkdir .tmp-anttiharju-compare-changes # no -p on purpose: why would you have directory with this name in your repository?
        printf '*\n' > .tmp-anttiharju-compare-changes/.gitignore

    - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      name: Checkout (pull_request / merge_group)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .tmp-anttiharju-compare-changes/${{ github.repository }}
        fetch-depth: 2
        persist-credentials: false
    - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      name: Find changes (pull_request / merge_group)
      id: run
      working-directory: .tmp-anttiharju-compare-changes/${{ github.repository }}
      shell: sh
      env:
        BINARY: ${{ steps.check.outputs.directory }}/compare-changes
      run: |
        "$GITHUB_ACTION_PATH/scripts/run.sh"

    - if: github.event_name == 'push'
      name: Checkout (push)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .tmp-anttiharju-compare-changes/${{ github.repository }}
        persist-credentials: false
    - if: github.event_name == 'push'
      name: Find changes (push)
      id: run_push
      working-directory: .tmp-anttiharju-compare-changes/${{ github.repository }}
      shell: sh
      env:
        BINARY: ${{ steps.check.outputs.directory }}/compare-changes
        GITHUB_TOKEN: ${{ github.token }}
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: http.${{ github.server_url }}/.extraheader
      run: |
        "$GITHUB_ACTION_PATH/scripts/run-push.sh"

    - if: always()
      name: Remove checkout
      shell: sh
      run: |
        rm -rf .tmp-anttiharju-compare-changes
outputs:
  array:
    description: "JSON array of changed files."
    value: ${{ steps.run.outputs.array || steps.run_push.outputs.array }}
