name: "Find changes"
description: "Outputs a JSON array of changed files for downstream actions."
branding:
  icon: check-circle
  color: blue
runs:
  using: "composite"
  steps:
    - name: Check cache
      id: check
      shell: sh
      env:
        VERSION: "0.12.22"
      run: |
        "$GITHUB_ACTION_PATH/scripts/cache.sh"
    - name: Generate target triple
      id: target
      shell: sh
      env:
        OS: ${{ runner.os }} # Possible values are Linux, Windows, or macOS.
        ARCH: ${{ runner.arch }} # Possible values are X86, X64, ARM, or ARM64.
      run: |
        "$GITHUB_ACTION_PATH/scripts/target.sh"
    - if: steps.check.outputs.installed != 'true'
      name: Cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.check.outputs.directory }}/compare-changes
        key: compare-changes_0.12.22_${{ steps.target.outputs.triple }}
    - if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: Install
      working-directory: ${{ steps.check.outputs.directory }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "0.12.22"
        TARGET: ${{ steps.target.outputs.triple }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install.sh"
    - name: Verify binary
      shell: sh
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        TARGET: ${{ steps.target.outputs.triple }}
        MACOS_ARM_SHA: "e8ed3a8288977b8f0c963ed2046f3436908c2e56b2722ded0a13bb89aed35c9a"
        LINUX_ARM_SHA: "a33911fb51f3143a81387423df316f3551e7085137a217c983b39b02648c6008"
        LINUX_X64_SHA: "6f61c7233443f67a48c43257818c556b239bd51d1034fad70c4f5e558333d2e8"
      run: |
        "$GITHUB_ACTION_PATH/scripts/verify.sh"
    - name: Prepare checkout
      shell: sh
      run: |
        mkdir .tmp-anttiharju-compare-changes # no -p on purpose: why would you have directory with this name in your repository?
        printf '*\n' > .tmp-anttiharju-compare-changes/.gitignore
    - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .tmp-anttiharju-compare-changes/${{ github.repository }}
        fetch-depth: 2
        persist-credentials: true
    - if: github.event_name == 'push'
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .tmp-anttiharju-compare-changes/${{ github.repository }}
        persist-credentials: true
    - name: Run
      id: run
      working-directory: .tmp-anttiharju-compare-changes/${{ github.repository }}
      shell: sh
      env:
        BINARY: ${{ steps.check.outputs.directory }}/compare-changes
      run: |
        "$BINARY" --find
    - if: always()
      name: Remove temporary checkout
      shell: sh
      run: |
        rm -rf .tmp-anttiharju-compare-changes
outputs:
  array:
    description: "JSON array of changed files."
    value: ${{ steps.run.outputs.array }}
